<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var msg = (err.message || err.stack || err.reason || String(err)).toLowerCase();
          return msg.includes('websocket') ||
                 msg.includes('@vite/client') ||
                 msg.includes('vite:ws') ||
                 msg.includes('connection refused') ||
                 msg.includes('closed without opened');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
